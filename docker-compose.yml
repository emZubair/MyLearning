services:
  web:
    build: .
    ports:
      - "8009:8009"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - memcached

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edX}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5439:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  memcached:
    image: memcached:1-alpine
    ports:
      - "11211:11211"

volumes:
  postgres_data:
